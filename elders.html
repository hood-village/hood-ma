<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بزرگان | هود ما</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">

  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-green-800 mb-6">بزرگان روستای هود</h1>
    
    <div id="content" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://prqisxwyjypiewgwjvaq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6TVYZ-5OenCPhs39jgmFbw_RM5qTuAT';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadElders() {
      const { data, error } = await supabase
        .from('elders')
        .select('*')
        .eq('status', 'published')
        .order('created_at', { ascending: false });

      const container = document.getElementById('content');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-500">هنوز مطلبی منتشر نشده است.</p>';
        return;
      }

      let html = '';
      data.forEach(item => {
        html += `
          <div class="bg-white rounded-xl shadow p-4">
            ${item.image_url ? `<img src="${item.image_url}" class="w-full h-48 object-cover rounded-lg mb-3">` : ''}
            <h3 class="font-bold text-lg mb-2">${item.title}</h3>
            <p class="text-gray-600">${item.description || ''}</p>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    loadElders();
  </script>
</body>
</html>
