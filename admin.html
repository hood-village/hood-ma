<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | هود ما</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">

  <div class="max-w-4xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-green-800">پنل مدیریت هود ما</h1>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm">خروج</button>
    </div>

    <!-- فرم ورود -->
    <div id="login-section" class="max-w-sm mx-auto mt-10">
      <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-4">ورود به پنل مدیریت</h2>
        <input id="email" type="email" placeholder="ایمیل" class="w-full border p-3 rounded mb-3">
        <input id="password" type="password" placeholder="رمز عبور" class="w-full border p-3 rounded mb-3">
        <button onclick="login()" class="w-full bg-green-700 text-white py-3 rounded">ورود</button>
      </div>
    </div>

    <!-- پنل اصلی -->
    <div id="admin-section" class="hidden">
      <div class="bg-white p-6 rounded-xl shadow mb-6">
        <h2 class="font-semibold mb-4">افزودن مطلب جدید</h2>
        
        <select id="table" class="w-full border p-3 rounded mb-3">
          <option value="elders">بزرگان</option>
          <option value="mosques">مساجد</option>
          <option value="gallery">گالری</option>
          <option value="history">تاریخچه</option>
          <option value="nature">طبیعت</option>
        </select>

        <input id="title" type="text" placeholder="عنوان" class="w-full border p-3 rounded mb-3">
        <textarea id="description" placeholder="توضیحات" class="w-full border p-3 rounded mb-3 h-28"></textarea>
        <input id="image_url" type="text" placeholder="آدرس تصویر (URL)" class="w-full border p-3 rounded mb-3">

        <button onclick="addContent()" class="bg-green-700 text-white px-6 py-3 rounded w-full">ذخیره به صورت پیش‌نویس</button>
      </div>

      <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="font-semibold mb-4">مطالب پیش‌نویس</h2>
        <div id="content-list"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://prqisxwyjypiewgwjvaq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6TVYZ-5OenCPhs39jgmFbw_RM5qTuAT';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('خطا در ورود: ' + error.message);
      } else {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadContents();
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function addContent() {
      const table = document.getElementById('table').value;
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const image_url = document.getElementById('image_url').value;

      const { error } = await supabase.from(table).insert({
        title,
        description,
        image_url,
        status: 'draft'
      });

      if (error) {
        alert('خطا: ' + error.message);
      } else {
        alert('با موفقیت ذخیره شد (پیش‌نویس)');
        loadContents();
      }
    }

    async function loadContents() {
      const container = document.getElementById('content-list');
      container.innerHTML = 'در حال بارگذاری...';

      let html = '';
      const tables = ['elders', 'mosques', 'gallery', 'history', 'nature'];

      for (let table of tables) {
        const { data } = await supabase.from(table).select('*').eq('status', 'draft').order('created_at', { ascending: false });
        if (data && data.length > 0) {
          html += `<h3 class="font-bold mt-4 mb-2">${table}</h3>`;
          data.forEach(item => {
            html += `
              <div class="border p-3 mb-2 rounded flex justify-between items-center">
                <div>
                  <strong>${item.title || 'بدون عنوان'}</strong>
                </div>
                <div>
                  <button onclick="publishItem('${table}', '${item.id}')" class="bg-blue-600 text-white px-3 py-1 text-sm rounded">انتشار</button>
                  <button onclick="deleteItem('${table}', '${item.id}')" class="bg-red-500 text-white px-3 py-1 text-sm rounded mr-1">حذف</button>
                </div>
              </div>`;
          });
        }
      }
      container.innerHTML = html || 'هیچ پیش‌نویسی وجود ندارد.';
    }

    async function publishItem(table, id) {
      await supabase.from(table).update({ status: 'published' }).eq('id', id);
      loadContents();
    }

    async function deleteItem(table, id) {
      if (confirm('آیا مطمئن هستید؟')) {
        await supabase.from(table).delete().eq('id', id);
        loadContents();
      }
    }

    // بررسی وضعیت ورود هنگام باز شدن صفحه
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadContents();
      }
    }

    checkUser();
  </script>
</body>
</html>
